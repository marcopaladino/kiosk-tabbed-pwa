<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Kiosk...</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { background-color: #ffffff; margin: 0; }
  </style>
</head>
<body>

  <script>
    // Primary site loaded directly inside Tab 1
    const firstTabUrl = "https://sites.google.com/ocdsb.ca/yourpagetitle/home";

    // Secondary sites opened across additional tabs
    const urlsToOpenInNewTabs = [
      "https://vault.vretta.com/#/en/login-student",
      "https://sites.google.com/ocdsb.ca/calculator",
      "https://sites.google.com/ocdsb.ca/graphingcalculator",
      "https://sites.google.com/ocdsb.ca/polypad",
      "https://sites.google.com/ocdsb.ca/geogebra",
      "https://sites.google.com/ocdsb.ca/translategreen/translate"
    ];

    function launchKiosk() {
      // Open secondary tabs
      urlsToOpenInNewTabs.forEach(url => {
        window.open(url, '_blank');
      });

      // Redirect Tab 1 to primary EQAO site
      window.location.href = firstTabUrl;
    }

    // Intercept keyboard shortcuts
    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      const ctrlOrCmd = event.ctrlKey || event.metaKey;

      // Block single function keys
      if (['f5', 'f12'].includes(key)) {
        event.preventDefault();
        event.stopPropagation();
        return false;
      }

      // Block Ctrl/Cmd + [Key] combinations
      // p = Print, s = Save, u = View Source, w = Close Tab, r = Reload, t = New Tab, n = New Window
      const blockedCtrlKeys = ['p', 's', 'u', 'w', 'r', 't', 'n', 'h'];
      if (ctrlOrCmd && blockedCtrlKeys.includes(key)) {
        event.preventDefault();
        event.stopPropagation();
        return false;
      }

      // Block Ctrl/Cmd + Shift + [Key] combinations
      // i, j, c = DevTools, r = Hard Reload, n = Incognito, t = Reopen Closed Tab
      if (ctrlOrCmd && event.shiftKey && ['i', 'j', 'c', 'r', 'n', 't'].includes(key)) {
        event.preventDefault();
        event.stopPropagation();
        return false;
      }
    }, true); // Captures keystrokes before underlying page elements process them

    // Block right-click context menu (prevents Inspect Element / Print)
    document.addEventListener('contextmenu', (event) => {
      event.preventDefault();
    });

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(launchKiosk, 400);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
