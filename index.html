<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Kiosk...</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { background-color: #ffffff; margin: 0; }
  </style>
</head>
<body>

  <script>
    // Primary site loaded directly inside Tab 1
    const firstTabUrl = "https://eqao.vretta.com/#/en/login-student";

    // Secondary sites opened across additional tabs
    const urlsToOpenInNewTabs = [
      "https://vault.vretta.com/#/en/login-student",
      "https://sites.google.com/ocdsb.ca/calculator",
      "https://sites.google.com/ocdsb.ca/graphingcalculator",
      "https://sites.google.com/ocdsb.ca/polypad",
      "https://sites.google.com/ocdsb.ca/geogebra",
      "https://sites.google.com/ocdsb.ca/translategreen/translate"
    ];

    function launchKiosk() {
      // Open secondary tabs
      urlsToOpenInNewTabs.forEach(url => {
        window.open(url, '_blank');
      });

      // Redirect Tab 1 to primary EQAO site
      window.location.href = firstTabUrl;
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(launchKiosk, 400);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
