<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosk Launcher</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f8f9fa;
      color: #202124;
    }
    .card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Kiosk Dashboard</h2>
    <p>Opening assessment tabs...</p>
  </div>

  <script>
    // All 7 target sites
    const targetUrls = [
      "https://eqao.vretta.com/#/en/login-student",
      "https://vault.vretta.com/#/en/login-student",
      "https://sites.google.com/ocdsb.ca/calculator",
      "https://sites.google.com/ocdsb.ca/graphingcalculator",
      "https://sites.google.com/ocdsb.ca/polypad",
      "https://sites.google.com/ocdsb.ca/geogebra",
      "https://sites.google.com/ocdsb.ca/translategreen/translate"
    ];

    function launchTabs() {
      targetUrls.forEach(url => {
        window.open(url, '_blank');
      });
    }

    // Intercept keyboard shortcuts
    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      const ctrlOrCmd = event.ctrlKey || event.metaKey;

      if (['f5', 'f12'].includes(key)) {
        event.preventDefault();
        event.stopPropagation();
        return false;
      }

      const blockedCtrlKeys = ['p', 's', 'u', 'w', 'r', 't', 'n', 'h'];
      if (ctrlOrCmd && blockedCtrlKeys.includes(key)) {
        event.preventDefault();
        event.stopPropagation();
        return false;
      }

      if (ctrlOrCmd && event.shiftKey && ['i', 'j', 'c', 'r', 'n', 't'].includes(key)) {
        event.preventDefault();
        event.stopPropagation();
        return false;
      }
    }, true);

    // Disable right-click
    document.addEventListener('contextmenu', (event) => {
      event.preventDefault();
    });

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(launchTabs, 500);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
