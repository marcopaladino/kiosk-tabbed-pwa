<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosk Assessment App</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background: #202124; }
    
    /* Custom Top Tab Bar */
    .tab-bar {
      display: flex;
      background: #292a2d;
      border-bottom: 2px solid #3c4043;
      height: 42px;
      padding-top: 4px;
      padding-left: 6px;
      overflow-x: auto;
    }
    
    .tab-button {
      padding: 8px 16px;
      background: #35363a;
      color: #9aa0a6;
      border: none;
      border-radius: 8px 8px 0 0;
      margin-right: 4px;
      font-size: 30px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }
    
    .tab-button.active {
      background: #ffffff;
      color: #202124;
      font-weight: 600;
    }

    /* Content Panels */
    .tab-content-container {
      width: 100vw;
      height: calc(100vh - 42px);
      position: relative;
      background: #ffffff;
    }

    .tab-panel {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
    }

    .tab-panel.active {
      display: flex;
    }

    /* Instruction Banner (+6pt font size increase) */
    .instruction-banner {
      height: 48px;
      line-height: 48px;
      padding: 0 16px;
      font-size: 20px;
      background-color: #f8f9fa;
      color: #202124;
      border-bottom: 1px solid #dadce0;
    }

    /* Iframe Cropping Wrapper */
    .desmos-crop-container {
      width: 100%;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .desmos-crop-container iframe {
      position: absolute;
      top: -55px; /* Crops top header bar */
      left: 0;
      width: 100%;
      height: calc(100% + 95px); /* Extends height to push footer off-screen */
      border: none;
    }

    iframe.standard-iframe {
      width: 100%;
      flex: 1;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Top Tab Bar -->
  <div class="tab-bar">
    <button class="tab-button active" onclick="switchTab(0)">Home</button>
    <button class="tab-button" onclick="switchTab(1)">Vault Vretta</button>
    <button class="tab-button" onclick="switchTab(2)">Scientific Calculator</button>
    <button class="tab-button" onclick="switchTab(3)">Graphing Calculator</button>
    <button class="tab-button" onclick="switchTab(4)">Polypad</button>
    <button class="tab-button" onclick="switchTab(5)">GeoGebra</button>
    <button class="tab-button" onclick="switchTab(6)">Translate</button>
  </div>

  <!-- Content Panels -->
  <div class="tab-content-container">
    <!-- Tab 0: Home -->
    <div class="tab-panel active">
      <iframe class="standard-iframe" src="https://sites.google.com/ocdsb.ca/yourpagetitle/home"></iframe>
    </div>

    <!-- Tab 1: Vault Vretta -->
    <div class="tab-panel">
      <iframe class="standard-iframe" src="https://vault.vretta.com/#/en/login-student"></iframe>
    </div>

    <!-- Tab 2: Cropped Desmos Scientific Calculator -->
    <div class="tab-panel">
      <div class="instruction-banner">
        If needed, the <strong>wrench 🔧</strong> icon on the calculator can be used to increase the font size.
      </div>
      <div class="desmos-crop-container">
        <iframe 
          src="https://www.desmos.com/scientific" 
          name="myiFrame" 
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- Tab 3: Graphing Calculator -->
    <div class="tab-panel">
      <iframe class="standard-iframe" src="https://sites.google.com/ocdsb.ca/graphingcalculator"></iframe>
    </div>

    <!-- Tab 4: Polypad -->
    <div class="tab-panel">
      <iframe class="standard-iframe" src="https://sites.google.com/ocdsb.ca/polypad"></iframe>
    </div>

    <!-- Tab 5: GeoGebra -->
    <div class="tab-panel">
      <iframe class="standard-iframe" src="https://sites.google.com/ocdsb.ca/geogebra"></iframe>
    </div>

    <!-- Tab 6: Translate -->
    <div class="tab-panel">
      <iframe class="standard-iframe" src="https://sites.google.com/ocdsb.ca/translategreen/translate"></iframe>
    </div>
  </div>

  <script>
    // Switch visible tab and panel
    function switchTab(index) {
      const tabs = document.querySelectorAll('.tab-button');
      const panels = document.querySelectorAll('.tab-panel');

      tabs.forEach((tab, i) => tab.classList.toggle('active', i === index));
      panels.forEach((panel, i) => panel.classList.toggle('active', i === index));
    }

    // Intercept keyboard shortcuts
    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      const ctrlOrCmd = event.ctrlKey || event.metaKey;

      if (['f5', 'f12'].includes(key)) {
        event.preventDefault();
        event.stopPropagation();
        return false;
      }

      const blockedCtrlKeys = ['p', 's', 'u', 'w', 'r', 't', 'n', 'h'];
      if (ctrlOrCmd && blockedCtrlKeys.includes(key)) {
        event.preventDefault();
        event.stopPropagation();
        return false;
      }

      if (ctrlOrCmd && event.shiftKey && ['i', 'j', 'c', 'r', 'n', 't'].includes(key)) {
        event.preventDefault();
        event.stopPropagation();
        return false;
      }
    }, true);

    // Disable right-click context menu
    document.addEventListener('contextmenu', (event) => {
      event.preventDefault();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
